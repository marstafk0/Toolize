<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Blocked — Toolize</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #fbfaf8; color: #1d1c1a;
    }
    @media (prefers-color-scheme: dark) { body { background: #1b1b1a; color: #edebe6; } }
    main { max-width: 30rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.4rem; margin: 0 0 .75rem; }
    p { color: #6b6862; margin: .5rem 0; }
    @media (prefers-color-scheme: dark) { p { color: #9c988f; } }
    .mark { width: 54px; height: 54px; border-radius: 50%; background: #2f5d50; margin: 0 auto 1.25rem; position: relative; }
    .mark::after { content: ""; position: absolute; inset: 45% 25%; background: #fff; border-radius: 2px; }
    button {
      margin-top: 1.25rem; font: inherit; padding: .45rem 1rem; border-radius: 6px; cursor: pointer;
      border: 1px solid #c9c5bd; background: transparent; color: inherit;
    }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <div class="mark"></div>
    <h1>This site is blocked</h1>
    <p id="why">Toolize blocks known adult sites before they load.</p>
    <p id="site" hidden></p>
    <button id="unblock" hidden>Unblock this site</button>
    <p id="status"></p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
