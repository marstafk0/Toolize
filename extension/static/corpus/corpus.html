<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Toolize — corpus regression</title>
  <style>
    body { font: 13px/1.45 system-ui, sans-serif; margin: 24px; background: #fbfaf8; color: #1d1c1a; max-width: 1100px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .muted { color: #6b6862; }
    table { border-collapse: collapse; margin: 12px 0 20px; font-variant-numeric: tabular-nums; }
    th, td { padding: 5px 12px; border-bottom: 1px solid #e4e1db; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #6b6862; font-weight: 600; }
    .bad { color: #b03a2e; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .miss { font-size: 11px; background: #fff; border: 1px solid #e4e1db; border-radius: 6px; padding: 6px; }
    .miss img { width: 100%; height: 110px; object-fit: cover; border-radius: 4px; filter: blur(12px); transition: filter .2s; }
    .miss img:hover { filter: none; }
    .overflow { overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Corpus regression</h1>
  <p class="muted" id="status">Loading…</p>
  <div class="overflow" id="summary"></div>
  <div id="misses"></div>
  <script type="module" src="corpus.js"></script>
</body>
</html>
